[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunter"
version = "0.1.0"
description = "Daily discovery of remote software jobs that can hire someone living in Lebanon."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "anthropic>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobhunter = "jobhunter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
