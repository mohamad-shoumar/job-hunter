[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunter"
version = "0.1.0"
description = "Daily discovery of remote software jobs that can hire someone living in Lebanon."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "anthropic>=1.8"]

[project.optional-dependencies]
# `jobhunter serve`: the local web app.
web = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8", "fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
jobhunter = "jobhunter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobhunter = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
