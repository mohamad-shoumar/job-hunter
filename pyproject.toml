[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunter"
version = "0.1.0"
description = "Daily discovery of remote software jobs that can hire someone living in Lebanon."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "anthropic>=1.8"]

[project.optional-dependencies]
# `jobhunter serve`: the local web app.
web = ["fastapi>=0.115", "uvicorn>=0.30"]
# Tests (they cover the web app too) and the linter CI runs.
dev = ["jobhunter[web]", "pytest>=8", "ruff>=0.6"]

[project.scripts]
jobhunter = "jobhunter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobhunter = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test this checkout's code, even when another checkout is installed in the venv.
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# No "I" (import sorting): ruff would rewrap every long import one name per line, a style change in ~20 files.
select = ["E", "F", "W", "B", "UP"]
ignore = [
    "E501",  # 120 is the width we write to; ~140 lines (mostly strings and test data) run a little over
    "B905",  # zip() without strict=: the zipped lists are the same length by construction
]

[tool.ruff.lint.per-file-ignores]
# FastAPI reads Depends() and the request-body defaults from the route's signature.
"src/jobhunter/web/app.py" = ["B008"]
